# One-time isolated generated-Context bootstrap on the existing Draft PR branch.
# No Linux host, WSL, Podman, NemoClaw, Hermes or Windows service operations.
name: Publish ContextCanon Linux draft context
on:
  push:
    branches:
      - feat/78-linux-bootstrap-extraction
    paths:
      - .github/workflows/bootstrap-contextcanon.yml
permissions:
  contents: write
jobs:
  publish-review-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Linux feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv for isolated ContextCanon CLI
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.26"
      - name: Get exact published Development Workflow parent
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --quiet https://github.com/SomeSunlight/context-canon.git "$RUNNER_TEMP/context-canon"
          git -C "$RUNNER_TEMP/context-canon" checkout --quiet --detach 5a1f2bff24a9f6c6af49d96044eaf15b80d0d0b6
          test -f "$RUNNER_TEMP/context-canon/nodes/library/development-workflow/CONTEXT.md"
          git -C "$RUNNER_TEMP/context-canon" diff --exit-code
      - name: Adopt parent and build with pinned official ContextCanon
        shell: bash
        run: |
          set -Eeuo pipefail
          cli=(uvx --from 'git+https://github.com/SomeSunlight/context-canon.git@5a1f2bff24a9f6c6af49d96044eaf15b80d0d0b6' contextcanon)
          "${cli[@]}" --version
          "${cli[@]}" build .
          "${cli[@]}" source adopt "$RUNNER_TEMP/context-canon/nodes/library/development-workflow" --node .
          "${cli[@]}" source list
          "${cli[@]}" build --all .
          "${cli[@]}" check --all .
          git diff --check
      - name: Commit exact ContextCanon-generated output on Linux Draft branch only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/78-linux-bootstrap-extraction"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No generated changes; no commit necessary.'
          else
            git commit -m 'build(contextcanon): adopt reviewed Development Workflow parent'
            git push origin HEAD:refs/heads/feat/78-linux-bootstrap-extraction
          fi
